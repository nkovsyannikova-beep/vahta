<script type="module">
import { createClient } from 'https://esm.sh/@supabase/supabase-js@2';

/* ====================================================================
   КОНФИГУРАЦИЯ — заполнить перед публикацией
   Project Settings → API → Project URL и anon public key
   ==================================================================== */
const CFG = {
  SUPABASE_URL:      'https://jprvdayeptlglcesnbvw.supabase.co',
  SUPABASE_ANON_KEY: 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImpwcnZkYXllcHRsZ2xjZXNuYnZ3Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3ODUxNDk4OTIsImV4cCI6MjEwMDcyNTg5Mn0.48CuGzOcEfb3bZh-0MKTnWIE068eoTEUET2IVHSlJ44',

  // Кабинет OneTwoTrip B2B — покупка идёт только здесь.
  // Розничный onetwotrip.com не использовать: оплата личной картой
  // не даёт закрывающих документов для бухгалтерии.
  OTT_CABINET: 'https://b2b.onetwotrip.com/',

  // Если менеджер OTT подтвердит формат deep-link с маршрутом и датой —
  // соберите ссылку здесь. Пока возвращаем кабинет.
  buildBookingLink(emp) { return this.OTT_CABINET; }
};

const sb = createClient(CFG.SUPABASE_URL, CFG.SUPABASE_ANON_KEY);

/* ====================================================================
   УТИЛИТЫ
   ==================================================================== */

// Экранирование: & < > " ' — полный набор, безопасно и в тексте, и в атрибутах
const ESC_MAP = { '&':'&amp;', '<':'&lt;', '>':'&gt;', '"':'&quot;', "'":'&#39;' };
const esc = s => String(s ?? '').replace(/[&<>"']/g, c => ESC_MAP[c]);

const pad2 = n => String(n).padStart(2, '0');
const DAY = 86400000;

// Окно графика: с 1-го числа текущего месяца, 6 месяцев вперёд.
// Считается при загрузке страницы — «сегодня» не разъезжается с реальностью.
const now0 = new Date();
const W0 = Date.UTC(now0.getFullYear(), now0.getMonth(), 1);
const TODAY = Math.round((Date.UTC(now0.getFullYear(), now0.getMonth(), now0.getDate()) - W0) / DAY);

const MONTHS = (() => {
  const names = ['январь','февраль','март','апрель','май','июнь','июль','август','сентябрь','октябрь','ноябрь','декабрь'];
  const out = []; let off = 0;
  for (let i = 0; i < 6; i++) {
    const d = new Date(W0); d.setUTCMonth(d.getUTCMonth() + i);
    const y = d.getUTCFullYear(), m = d.getUTCMonth();
    const len = new Date(Date.UTC(y, m + 1, 0)).getUTCDate();
    out.push({ label: names[m], year: y, mm: pad2(m + 1), off, len });
    off += len;
  }
  return out;
})();
const TOTAL = MONTHS.reduce((s, m) => s + m.len, 0);

const isoToIdx = s => s ? Math.round((Date.parse(s + 'T00:00:00Z') - W0) / DAY) : NaN;
const idxToIso = i => new Date(W0 + i * DAY).toISOString().slice(0, 10);
const idxToRu  = i => { const d = new Date(W0 + i * DAY); return pad2(d.getUTCDate()) + '.' + pad2(d.getUTCMonth() + 1); };
const isoToRu  = s => s ? s.split('-').reverse().join('.') : '—';
const nowTime  = () => { const d = new Date(); return pad2(d.getHours()) + ':' + pad2(d.getMinutes()); };
const nowDate  = () => { const d = new Date(); return pad2(d.getDate()) + '.' + pad2(d.getMonth() + 1) + '.' + d.getFullYear(); };
const fmtMoney = v => v == null ? '—' : Number(v).toLocaleString('ru-RU') + ' ₽';

/* ====================================================================
   СОСТОЯНИЕ
   ==================================================================== */
const S = {
  ready: false, authed: false, user: null, loading: false,
  route: 'dash', objTab: 'АМУР', filter: 'все', q: '',
  sel: null, schedMonth: MONTHS[0].label, modal: null, toast: null,
  data: { employees: [], tickets: [], transfers: [], factors: [], surveys: [], log: [], settings: {} }
};

let toastTimer = null;
function toast(text, isErr) {
  S.toast = { text, err: !!isErr };
  render();
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { S.toast = null; render(); }, 3200);
}
const fail = (e, what) => toast((what ? what + ': ' : '') + (e?.message || 'не удалось выполнить'), true);

/* ====================================================================
   ДАННЫЕ
   ==================================================================== */
async function loadAll() {
  S.loading = true; render();
  try {
    const [emp, tik, trf, fac, srv, log, cfg] = await Promise.all([
      sb.from('v_employees').select('*').order('fio_short'),
      sb.from('tickets').select('*').order('created_at', { ascending: false }),
      sb.from('transfers').select('*').order('created_at', { ascending: false }),
      sb.from('factors').select('*'),
      sb.from('surveys').select('*').order('created_at', { ascending: false }).limit(200),
      sb.from('audit_log').select('*').order('ts', { ascending: false }).limit(200),
      sb.from('settings').select('*')
    ]);
    const err = [emp, tik, trf, fac, srv, log, cfg].find(r => r.error);
    if (err) throw err.error;

    S.data.employees = emp.data || [];
    S.data.tickets   = tik.data || [];
    S.data.transfers = trf.data || [];
    S.data.factors   = fac.data || [];
    S.data.surveys   = srv.data || [];
    S.data.log       = log.data || [];
    S.data.settings  = Object.fromEntries((cfg.data || []).map(r => [r.key, r.value]));
  } catch (e) {
    fail(e, 'Загрузка данных');
  } finally {
    S.loading = false; render();
  }
}

async function writeLog(action, message, employee_id, details) {
  try {
    await sb.from('audit_log').insert({ actor: 'kadrovik', action, message, employee_id: employee_id || null, details: details || null });
  } catch (_) { /* журнал не должен ломать основное действие */ }
}

const activeEmployees = () => S.data.employees.filter(e => !e.is_archived && !e.fired_at);
const empById = id => S.data.employees.find(e => e.id === id);
const ticketsOf = (id, dir) => S.data.tickets.filter(t => t.employee_id === id && t.status !== 'отменён' && (!dir || t.direction === dir));
const hasRequest = (id, dir) => ticketsOf(id, dir).length > 0;

/* ====================================================================
   ГРАФИК — расчёт сегментов
   Пока Edge Function rebuild-schedule не задеплоена, сегменты считаются
   здесь. Когда появится — берите готовые из schedule_segments.
   ==================================================================== */
function segments(p) {
  const out = [];
  const push = (k, a, b) => { a = Math.max(0, a); b = Math.min(TOTAL, b); if (b > a) out.push({ k, a, b }); };
  const work = p.cycle_work || 30, rest = p.cycle_rest || 28, tr = p.travel_days ?? 2;
  const ns = isoToIdx(p.next_shift);
  const dOut = isoToIdx(p.date_out);

  if (p.status === 'на вахте') {
    const end = !isNaN(dOut) ? dOut : TODAY + work;
    push('вахта', 0, end);
    push('в пути', end, end + tr);
    if (!isNaN(ns)) push('дома', end + tr, ns - tr);
  } else if (!isNaN(ns)) {
    push('дома', 0, ns - tr);
  }

  if (!isNaN(ns)) {
    push('в пути', ns - tr, ns);
    let s = ns, first = true, guard = 0;
    while (s < TOTAL && guard++ < 40) {
      let we = s + work;
      if (first && !isNaN(dOut) && dOut > s) we = dOut;
      push('вахта', s, we);
      push('в пути', we, we + tr);
      push('дома', we + tr, we + tr + rest);
      push('в пути', we + tr + rest, we + tr + rest + tr);
      s = we + tr + rest + tr;
      first = false;
    }
  }

  // Отпуск и больничный перекрывают всё — ставим первыми, find() выберет их
  const over = S.data.factors
    .filter(f => f.employee_id === p.id && (f.kind === 'отпуск' || f.kind === 'больничный'))
    .map(f => ({ k: f.kind, a: isoToIdx(f.date_from), b: isoToIdx(f.date_to) + 1 }))
    .filter(x => !isNaN(x.a) && !isNaN(x.b));

  return over.concat(out);
}

const SEG_COLOR = { 'вахта':'#86efac', 'в пути':'#fde68a', 'дома':'#eef2f6', 'отпуск':'#ddd0ff', 'больничный':'#bae6fd' };
function bars(p) {
  return segments(p).map(s =>
    `<div style="position:absolute;top:0;bottom:0;left:${(s.a / TOTAL * 100).toFixed(2)}%;width:${((s.b - s.a) / TOTAL * 100).toFixed(2)}%;background:${SEG_COLOR[s.k]}"></div>`
  ).join('') +
  `<div style="position:absolute;top:0;bottom:0;left:${(TODAY / TOTAL * 100).toFixed(2)}%;width:2px;background:#F28482"></div>`;
}

function dueOf(e) {
  if (e.status === 'дома') {
    if (e.days_to_shift == null) return { text: 'дата заезда не задана', warn: true, days: null };
    return { text: 'на вахту через ' + e.days_to_shift + ' дн', warn: e.days_to_shift <= 21, days: e.days_to_shift };
  }
  if (e.status === 'на вахте') {
    if (e.days_to_home == null) return { text: 'дата выезда не задана', warn: true, days: null };
    return { text: 'домой через ' + e.days_to_home + ' дн', warn: e.days_to_home <= 21, days: e.days_to_home };
  }
  return { text: e.status, warn: false, days: null };
}

  async copy(d) {

  async reqTicket(d) {
    const e = empById(d.id); if (!e) return;
    const dir = d.dir;
    if (hasRequest(e.id, dir)) { toast('Запрос уже создан: ' + e.fio_short); return; }

    const departDate = dir === 'на вахту'
      ? (e.next_shift ? idxToIso(isoToIdx(e.next_shift) - (e.travel_days ?? 2)) : null)
      : e.date_out;
    const legs = [e.city, 'Новосибирск', e.dest_city].filter(Boolean);
    if (e.city === 'Новосибирск') legs.splice(1, 1);
    const route = dir === 'на вахту' ? legs.join(' → ') : legs.slice().reverse().join(' → ');

    const { error } = await sb.from('tickets').insert({
      employee_id: e.id, direction: dir, status: 'запрошен',
      route, depart_date: departDate, provider: 'OneTwoTrip B2B', source: 'manual'
    });
    if (error) return fail(error, 'Запрос билета');

    if (e.needs_transfer && dir === 'на вахту') {
      await sb.from('transfers').insert({
        employee_id: e.id, direction: dir,
        route: e.transfer_route || (e.city + ' → Новосибирск (Толмачёво)'),
        carrier: e.transfer_carrier || 'Автолайн', service_date: departDate
      });
    }
    await writeLog('ticket_request', 'Создан запрос билета ' + dir + ': ' + e.fio_short, e.id);
    toast('Запрос создан: ' + e.fio_short + ' · ' + dir);
    await loadAll();
  },

  async reqAll() {
    const home = activeEmployees().filter(e => e.status === 'дома' && !hasRequest(e.id, 'на вахту'));
    if (!home.length) return toast('Все запросы на заезд уже созданы');
    for (const e of home) await ACT.reqTicket({ id: e.id, dir: 'на вахту' });
    toast('Создано запросов: ' + home.length);
  },

  async chooseTicket(d) {
    const t = S.data.tickets.find(x => x.id === d.id); if (!t) return;
    const siblings = S.data.tickets.filter(x => x.employee_id === t.employee_id && x.direction === t.direction && x.is_chosen);
    for (const s of siblings) await sb.from('tickets').update({ is_chosen: false }).eq('id', s.id);
    const { error } = await sb.from('tickets').update({ is_chosen: true, status: 'к оформлению' }).eq('id', t.id);

  },

  buyModal(d)      { S.modal = { kind: 'buy', id: d.id }; render(); },
  passportModal(d) { S.modal = { kind: 'passport', id: d.id, loading: true, data: null }; render(); loadPassport(d.id); },

  async savePurchase() {

    const g = id => (document.getElementById(id) || {}).value || '';

      status: 'куплен',
      pnr: g('f_pnr').trim() || null,

      airline: g('f_airline').trim() || null,

      depart_date: g('f_date') || null,

    const { error } = await sb.from('tickets').update(patch).eq('id', m.id);
    if (error) return fail(error, 'Сохранение покупки');

  async cancelTicket(d) {

    const { error } = await sb.from('tickets').update({ status: 'отменён', is_chosen: false }).eq('id', d.id);

  // --- трансфер и график -------------------------------------------
  async transferReq(d) {

    const { error } = await sb.from('transfers').insert({
      employee_id: e.id, direction: 'на вахту',

      note: 'Сотрудник подтвердил даты', source: 'manual'

  // --- робот --------------------------------------------------------
  async runEdge(d) {
    toast('Запускаю: ' + d.fn + '…');

      const { data, error } = await sb.functions.invoke(d.fn, { body: {} });

  // --- выгрузка -----------------------------------------------------
  xls() {
    const rows = activeEmployees().map(e => '<tr><td>' + [
      e.fio, e.object_code || '', e.city || '', e.email || '', e.status,
      isoToRu(e.next_shift), isoToRu(e.date_out), e.needs_transfer ? (e.transfer_carrier || 'да') : '—'
    ].map(esc).join('</td><td>') + '</td></tr>').join('');

    const trows = S.data.tickets.filter(t => t.status !== 'отменён').map(t => {
      const e = empById(t.employee_id);
      return '<tr><td>' + [
        e?.fio_short || '', t.direction, t.route || '', isoToRu(t.depart_date),
        t.airline || '', t.flight_no || '', t.price == null ? '' : t.price, t.pnr || '', t.status
      ].map(esc).join('</td><td>') + '</td></tr>';
    }).join('');

    const html = '<html xmlns:x="urn:schemas-microsoft-com:office:excel"><head><meta charset="utf-8"></head><body>'
      + '<h3>График вахт — Аксиома Сервис · ' + nowDate() + ' ' + nowTime() + '</h3>'
      + '<table border="1"><tr><th>ФИО</th><th>Объект</th><th>Город</th><th>Почта</th><th>Статус</th>'
      + '<th>Заезд</th><th>Выезд домой</th><th>Трансфер</th></tr>' + rows + '</table>'
      + '<br><h3>Билеты</h3><table border="1"><tr><th>Сотрудник</th><th>Направление</th><th>Маршрут</th>'
      + '<th>Дата</th><th>Авиакомпания</th><th>Рейс</th><th>Цена</th><th>PNR</th><th>Статус</th></tr>'
      + (trows || '<tr><td colspan="9">нет записей</td></tr>') + '</table></body></html>';

    const blob = new Blob(['\ufeff' + html], { type: 'application/vnd.ms-excel;charset=utf-8' });
    const a = document.createElement('a');
    a.href = URL.createObjectURL(blob);
    a.download = 'График вахт — ' + nowDate() + '.xls';
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(() => URL.revokeObjectURL(a.href), 5000);
    toast('Файл сформирован');
  },

  // --- вход ---------------------------------------------------------
  async login() {
    const email = (document.getElementById('lg') || {}).value || '';
    const pass  = (document.getElementById('pw') || {}).value || '';
    if (!email || !pass) return toast('Введите почту и пароль', true);
    const btn = document.getElementById('loginBtn'); if (btn) btn.disabled = true;
    const { error } = await sb.auth.signInWithPassword({ email: email.trim(), password: pass });
    if (btn) btn.disabled = false;
    if (error) {
      const el = document.getElementById('lerr');
      if (el) { el.textContent = 'Не удалось войти. Проверьте почту и пароль.'; el.style.display = 'block'; }
      return;
    }
    // дальше сработает onAuthStateChange
  }
};

// Паспорт запрашивается только здесь — по одному сотруднику, по явному действию.
// В списочные запросы эта таблица не попадает никогда.
async function loadPassport(empId) {
  const { data, error } = await sb.from('passports').select('*').eq('employee_id', empId).maybeSingle();
  if (S.modal && S.modal.kind === 'passport' && S.modal.id === empId) {
    S.modal.loading = false;
    S.modal.data = error ? null : data;
    S.modal.error = error ? error.message : null;
    render();
  }
}

/* ====================================================================
   ДЕЛЕГИРОВАНИЕ СОБЫТИЙ
   Инлайновых onclick нет — данные передаются через data-атрибуты,
   поэтому кавычки в ФИО и в ответах сотрудников ничего не ломают.
   ==================================================================== */
document.addEventListener('click', ev => {
  // клик по затемнению вокруг модального окна закрывает его
  if (ev.target.classList && ev.target.classList.contains('modal-ov')) {
    S.modal = null; render(); return;
  }
  const el = ev.target.closest('[data-act]');
  if (!el) return;
  const fn = ACT[el.dataset.act];
  if (!fn) return;
  if (el.tagName === 'A' && !el.getAttribute('href')?.startsWith('http')) ev.preventDefault();
  fn({ ...el.dataset }, el);
});

document.addEventListener('change', ev => {
  const el = ev.target.closest('[data-change]');
  if (!el) return;
  const fn = ACT[el.dataset.change];
  if (fn) fn({ ...el.dataset }, el);
});

document.addEventListener('input', ev => {
  if (ev.target.id === 'srch') {
    S.q = ev.target.value;
    render();
    const el = document.getElementById('srch');
    if (el) { el.focus(); el.setSelectionRange(el.value.length, el.value.length); }
  }
});

document.addEventListener('keydown', ev => {
  if (ev.key === 'Enter' && (ev.target.id === 'pw' || ev.target.id === 'lg')) ACT.login();
  if (ev.key === 'Escape' && S.modal) { S.modal = null; render(); }
});

const chip = (text, cls) => `<span class="chip ${cls || ''}">${esc(text)}</span>`;
const dueChip = e => { const d = dueOf(e); return chip(d.text, d.warn ? 'warn' : 'line'); };
const stChip = e => e.status === 'на вахте' ? chip('на вахте', 'ok')
                  : e.status === 'в пути'   ? chip('в пути', 'warn')
                  : chip(e.status, 'line');

function stageBadge(e) {
  if (e.fired_at) return chip('уволен · ' + isoToRu(e.fired_at), 'bad');
  const dir = e.status === 'дома' ? 'на вахту' : 'домой';
  const ts = ticketsOf(e.id, dir);
  if (ts.some(t => t.status === 'куплен'))            return chip('✈ билет куплен', 'ok');
  if (ts.some(t => t.status === 'к оформлению'))      return chip('к оформлению', 'acc');
  if (ts.some(t => t.status === 'варианты получены')) return chip('варианты получены', 'acc');
  if (ts.length)                                      return chip('запрос создан', 'warn');
  const srv = S.data.surveys.find(s => s.employee_id === e.id && s.status === 'ответ получен');
  if (srv) return chip('ответ получен', 'acc');
  return chip('запрос не создан', 'line');
}

function eventList(all) {
  const ev = [];
  all.forEach(e => {
    const ns = isoToIdx(e.next_shift), dOut = isoToIdx(e.date_out);
    if (e.status === 'дома' && !isNaN(ns)) {
      ev.push({ id: e.id, at: ns - (e.travel_days ?? 2), fio: e.fio_short || e.fio, what: 'выезд из города (' + (e.city || '—') + ')', color: 'var(--warn)' });
      ev.push({ id: e.id, at: ns, fio: e.fio_short || e.fio, what: 'заезд на ' + (e.object_code || 'объект'), color: 'var(--ok)' });
    } else if (e.status === 'на вахте' && !isNaN(dOut)) {
      ev.push({ id: e.id, at: dOut, fio: e.fio_short || e.fio, what: 'выезд домой (' + (e.city || '—') + ')', color: 'var(--warn)' });
    }
  });
  return ev.filter(x => x.at >= TODAY && x.at <= TODAY + 45)
           .sort((a, b) => a.at - b.at)
           .map(x => ({ ...x, date: idxToRu(x.at) }));
}

/* ---------- график ---------- */
function scheduleView() {
  const all = activeEmployees();
  const m = MONTHS.find(x => x.label === S.schedMonth) || MONTHS[0];
  const tabs = MONTHS.map(x => `<button class="tab ${x.label === m.label ? 'on' : ''}" data-act="month" data-val="${esc(x.label)}">${esc(x.label)}</button>`).join('');

  const heads = Array.from({ length: m.len }, (_, i) => {
    const idx = m.off + i, dow = new Date(W0 + idx * DAY).getUTCDay();
    return `<th class="dayth ${idx === TODAY ? 'today' : (dow === 0 || dow === 6) ? 'we' : ''}">${i + 1}</th>`;
  }).join('');

  const CLS = { 'вахта':'v', 'в пути':'p', 'отпуск':'o', 'больничный':'s', 'дома':'' };
  const LBL = { 'вахта':'В', 'в пути':'П', 'отпуск':'О', 'больничный':'Б', 'дома':'' };

  const rows = all.map(p => {
    const segs = segments(p);
    let total = 0;
    const cells = Array.from({ length: m.len }, (_, i) => {
      const idx = m.off + i;
      const sg = segs.find(s => idx >= s.a && idx < s.b);
      const k = sg ? sg.k : 'дома';
      if (k === 'вахта') total++;
      const tip = (p.fio_short || p.fio) + ' · ' + pad2(i + 1) + '.' + m.mm + ' — ' + k;
      return `<td class="cell ${CLS[k]} ${idx === TODAY ? 't' : ''}" title="${esc(tip)}">${LBL[k]}</td>`;
    }).join('');
    return `<tr><td class="click" data-act="open" data-id="${esc(p.id)}" style="font-weight:600;white-space:nowrap;border-right:1px solid var(--line)">${esc(p.fio_short || p.fio)}</td>
      ${cells}<td class="mono" style="text-align:center;color:var(--ok);font-weight:700">${total}</td></tr>`;
  }).join('');

  return `<div style="display:flex;gap:8px;align-items:center;margin-bottom:14px;flex-wrap:wrap">
      <button class="pill mini" data-act="schedNav" data-step="-1" title="предыдущий месяц">◀</button>
      ${tabs}
      <button class="pill mini" data-act="schedNav" data-step="1" title="следующий месяц">▶</button>
      <span style="width:1px;height:18px;background:var(--line);margin:0 6px"></span>
      <span class="chip ok">В — вахта</span><span class="chip warn">П — в пути</span>
      <span class="chip" style="background:#ede0ff;color:#7c3aed">О — отпуск</span>
      <span class="chip" style="background:#e0f2fe;color:#0369a1">Б — больничный</span>
      <span class="chip line">пусто — дома</span>
      <button class="pill mini" style="margin-left:auto" data-act="xls"><span style="color:#F5C344">✦</span> Скачать .xls</button></div>
    <div class="card rise" style="overflow-x:auto">
      <table><thead><tr><th style="border-right:1px solid var(--line)">Сотрудник · ${esc(m.label)} ${m.year}</th>${heads}<th>Σ</th></tr></thead>
      <tbody>${rows || '<tr><td colspan="33" style="text-align:center;padding:26px;color:var(--sub)">Сотрудников нет</td></tr>'}</tbody></table></div>
    <div class="dim" style="font-size:.74rem;margin-top:12px">
      График строится от даты заезда по регламенту цикла; «в пути» — по 2 дня в каждую сторону.
      Отпуск и больничный перекрывают вахту.</div>`;
}

          <button class="pill mini ghost" data-act="closeModal">✕</button></div>
        <div style="font-weight:700;font-size:1rem">${esc(e?.fio_short || '')}</div>
        <div class="dim" style="font-size:.8rem;margin:4px 0 16px">${esc(t.route || '')} · ${esc(t.direction)}</div>
        <div class="field"><label for="f_pnr">PNR (код брони)</label><input id="f_pnr" value="${esc(t.pnr || '')}" placeholder="ABC123" /></div>
        <div class="field"><label for="f_date">Дата вылета</label><input id="f_date" type="date" value="${esc(t.depart_date || '')}" /></div>
        <div class="field"><label for="f_airline">Авиакомпания</label><input id="f_airline" value="${esc(t.airline || '')}" placeholder="S7 / Аэрофлот" /></div>
        <div class="field"><label for="f_flight">Номер рейса</label><input id="f_flight" value="${esc(t.flight_no || '')}" placeholder="S7 2501" /></div>
        <div class="field"><label for="f_price">Цена, ₽</label><input id="f_price" type="number" step="0.01" value="${t.price ?? ''}" /></div>
        <div style="display:flex;gap:8px;margin-top:16px">
          <button class="pill primary" data-act="savePurchase">Сохранить</button>
          <button class="pill ghost" data-act="closeModal">Отмена</button></div>
      </div></div>`;
  }

  if (S.modal.kind === 'passport') {
    const e = empById(S.modal.id);
    const p = S.modal.data;
    const row = (label, val) => val ? `<div style="display:flex;justify-content:space-between;align-items:center;gap:10px;padding:6px 0;border-top:1px solid var(--line2)">
      <span class="dim" style="font-size:.72rem;min-width:96px">${esc(label)}</span>
      <span style="font-weight:600;flex:1;text-align:right;word-break:break-all">${esc(val)}</span>
      <button class="pill mini ghost" style="padding:3px 10px" data-act="copy" data-val="${esc(val)}">копировать</button></div>` : '';

    return `<div class="modal-ov">
      <div class="modal-card">
        <div style="display:flex;justify-content:space-between;align-items:flex-start;margin-bottom:10px">
          <h3 style="color:#7c3aed;margin:0">Данные пассажира</h3>
          <button class="pill mini ghost" data-act="closeModal">✕</button></div>
        <div style="font-weight:700;font-size:1rem;margin-bottom:12px">${esc(e?.fio || '')}</div>
        ${S.modal.loading ? '<div class="empty">Загружаю…</div>'
          : p ? `<div style="background:#f6f2ff;border-radius:12px;padding:8px 14px 12px">
                ${row('Фамилия', p.last_name_lat)}${row('Имя', p.first_name_lat)}${row('Отчество', p.middle_name_lat)}
                ${row('Пол', p.sex === 'ж' ? 'женский' : p.sex === 'м' ? 'мужской' : '')}
                ${row('Дата рожд.', isoToRu(p.birth_date))}${row('Документ', p.doc_number)}${row('Гражданство', p.citizenship)}
              </div>
              <div class="dim" style="font-size:.72rem;margin-top:10px">
                Данные показаны только сейчас и только по этому сотруднику — в списки они не попадают.</div>`
          : `<div class="empty">Паспортных данных нет.<br><br>
               Если профили сотрудников заведены в кабинете OneTwoTrip B2B — так и должно быть:
               паспорт подставится там автоматически, а у нас не хранится.</div>`}
        <div style="display:flex;gap:8px;margin-top:16px">
          <a class="pill mini primary" href="${esc(CFG.OTT_CABINET)}" target="_blank" rel="noopener">Открыть кабинет ↗</a>
          <button class="pill mini ghost" data-act="closeModal">Закрыть</button></div>
      </div></div>`;
  }
  return '';
}

/* ====================================================================
   КАРКАС
   ==================================================================== */
function render() {
  const app = document.getElementById('app');
  const toastHtml = S.toast ? `<div class="toast ${S.toast.err ? 'err' : ''}">${esc(S.toast.text)}</div>` : '';

  if (!S.ready) { app.innerHTML = ''; return; }
  if (!S.authed) { app.innerHTML = loginView() + toastHtml; return; }

  const all = activeEmployees();
  const need = all.filter(e => e.status === 'дома'     && !hasRequest(e.id, 'на вахту')).length
             + all.filter(e => e.status === 'на вахте' && !hasRequest(e.id, 'домой')).length;

  const NAV = [
    ['dash',      'Дашборд',    need],
    ['people',    'Сотрудники', all.length],
    ['tickets',   'Билеты',     S.data.tickets.filter(t => t.status !== 'отменён').length],
    ['transfers', 'Трансферы',  S.data.transfers.length],
    ['schedule',  'График',     '30/28'],
    ['log',       'Журнал',     S.data.log.length]
  ];
  const active = S.route === 'person' ? 'people' : S.route;
  const sel = S.sel ? empById(S.sel) : null;
  const TITLES = {
    dash:      ['Дашборд', need + ' требуют действий'],
    people:    ['Сотрудники', S.objTab + ' · ' + all.filter(e => e.object_code === S.objTab).length + ' чел.'],
    person:    [sel?.fio_short || sel?.fio || '—', 'карточка сотрудника'],
    tickets:   ['Билеты', S.data.tickets.filter(t => t.status !== 'отменён').length + ' записей'],
    transfers: ['Трансферы', S.data.transfers.length + ' заявок'],
    schedule:  ['График вахт', S.schedMonth + ' ' + (MONTHS.find(m => m.label === S.schedMonth)?.year || '')],
    log:       ['Журнал', S.data.log.length + ' записей']
  };

  const view = S.loading ? '<div class="empty">Загружаю данные…</div>'
    : S.route === 'dash'      ? dashView()
    : S.route === 'people'    ? peopleView()
    : S.route === 'person'    ? personView()
    : S.route === 'tickets'   ? ticketsView()
    : S.route === 'transfers' ? transfersView()
    : S.route === 'log'       ? logView()
    : scheduleView();

  app.innerHTML = `<div class="layout">
    <nav class="side">
      <div class="brand">
        <div class="playfair" style="font-size:1.35rem">Пульт вахты</div>
        <div class="badge" style="font-size:.6rem;margin-top:4px">Аксиома Сервис · кадры</div>
      </div>
      <div class="nav">${NAV.map(([id, label, cnt]) =>
        `<button class="${id === active ? 'on' : ''}" data-act="go" data-route="${esc(id)}">
           <span>${esc(label)}</span><span class="cnt">${esc(cnt)}</span></button>`).join('')}</div>
      <div class="foot">
        <div style="display:flex;justify-content:space-between;align-items:center;gap:8px;margin-bottom:8px">
          <div style="min-width:0">
            <div style="font-weight:600;color:var(--ink);font-size:.78rem">Кадровик</div>
            <div class="mono" style="font-size:.62rem;overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(S.user?.email || '')}</div></div>
          <button class="pill ghost mini" data-act="logout">выйти</button></div>
        <div style="border-top:1px solid var(--line2);padding-top:8px">Обновлено ${nowDate()} · ${nowTime()}</div>
      </div>
    </nav>
    <div class="main">
      <div class="topbar">
        <div>
          <div style="font-size:1.15rem;font-weight:600;letter-spacing:-0.02em">${esc(TITLES[S.route][0])}</div>
          <div class="badge" style="font-size:.62rem;margin-top:2px">${esc(TITLES[S.route][1])}</div>
        </div>
        <div style="display:flex;gap:10px;align-items:center;flex-wrap:wrap">
          <button class="pill primary" data-act="reqAll">Запросить всем на заезд</button>
          <button class="pill" data-act="runEdge" data-fn="mail-poll">Проверить почту</button>
          <button class="pill ghost" data-act="refresh">Обновить</button>
        </div>
      </div>
      <div class="content">${view}</div>
    </div>
  </div>` + modalView() + toastHtml;
}

/* ====================================================================
   ЗАПУСК
   ==================================================================== */
sb.auth.onAuthStateChange((_event, session) => {
  const wasAuthed = S.authed;
  S.authed = !!session;
  S.user = session?.user || null;
  S.ready = true;
  render();
  if (S.authed && !wasAuthed) loadAll();
});

(async () => {
  const { data } = await sb.auth.getSession();
  S.authed = !!data.session;
  S.user = data.session?.user || null;
  S.ready = true;
  render();
  if (S.authed) loadAll();
})();
</script>
</body>
</html>
